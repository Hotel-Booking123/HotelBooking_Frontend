<div class="container mt-4">
  <div class="manage-header">
    <h2>Manage Hotels</h2>
    <button class="btn-add" (click)="showForm = true">+ Add Hotel</button>
  </div>

  <div class="form-card" *ngIf="showForm">
    <form [formGroup]="hotelForm" (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-group"><label>Name</label><input formControlName="name"></div>
        <div class="form-group"><label>Location</label><input formControlName="location"></div>
        <div class="form-group"><label>Description</label><textarea formControlName="description" rows="3"></textarea></div>
        <div class="form-group"><label>Amenities</label><input formControlName="amenities"></div>
        <div class="form-group"><label>Rating</label><input type="number" step="0.1" formControlName="averageRating"></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-save">Save</button>
        <button type="button" class="btn-cancel" (click)="resetForm()">Cancel</button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Name</th><th>Location</th><th>Amenities</th><th>Rating</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let hotel of hotels">
          <td>{{ hotel.id }}</td><td>{{ hotel.name }}</td><td>{{ hotel.location }}</td><td>{{ hotel.amenities }}</td><td>{{ hotel.averageRating }}</td>
          <td><button class="btn-edit" (click)="edit(hotel)">Edit</button><button class="btn-delete" (click)="delete(hotel.id)">Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
