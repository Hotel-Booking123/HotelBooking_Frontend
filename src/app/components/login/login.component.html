<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="auth-eyebrow">Welcome back</span>
      <h2>Sign In</h2>
      <p>Access your premium account</p>
    </div>

    <!-- Error Message -->
    <div class="alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email address</label>
        <input 
          type="email" 
          class="form-control" 
          formControlName="email" 
          placeholder="you@example.com"
          [class.is-invalid]="email?.invalid && email?.touched">
        <small class="text-danger" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Please enter a valid email address</span>
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input 
          type="password" 
          class="form-control" 
          formControlName="password" 
          placeholder="••••••••"
          [class.is-invalid]="password?.invalid && password?.touched">
        <small class="text-danger" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </small>
      </div>

      <button type="submit" class="btn-gold" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner-text">
          <span class="spinner"></span> Signing in...
        </span>
      </button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a routerLink="/register">Create one</a>
    </p>
  </div>
</div>
